<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="refresh" content="5">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BatteryBin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #2a2e37;
    --text: #e8e9ec;
    --muted: #9aa0ab;
    --accent: #5eead4;
    --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }
  h1 { font-size: 1.4rem; margin: 0; }
  #status { color: var(--muted); font-size: 0.85rem; }
  #search {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 0.9rem;
    width: 220px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card img {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    background: #000;
    display: block;
  }
  .card-body { padding: 12px 14px; }
  .type {
    font-size: 1.05rem;
    font-weight: 600;
    margin: 0 0 4px 0;
  }
  .not-battery .type { color: var(--bad); }
  .filename {
    font-size: 0.75rem;
    color: var(--muted);
    word-break: break-all;
    margin: 0 0 6px 0;
  }
  .reasoning {
    font-size: 0.8rem;
    color: var(--muted);
    margin: 0 0 6px 0;
    line-height: 1.3;
  }
  .timestamp {
    font-size: 0.72rem;
    color: var(--muted);
  }
  .empty {
    color: var(--muted);
    padding: 40px;
    text-align: center;
  }
  .section {
    margin-bottom: 18px;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.015);
  }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    cursor: pointer;
    user-select: none;
    background: var(--card);
  }
  .section-header:hover { background: #1c2028; }
  .section-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    font-size: 0.95rem;
  }
  .section-count {
    font-weight: 400;
    color: var(--muted);
    font-size: 0.8rem;
  }
  .chevron {
    display: inline-block;
    transition: transform 0.15s ease;
    color: var(--muted);
    font-size: 0.75rem;
  }
  .section.collapsed .chevron { transform: rotate(-90deg); }
  .section-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
    padding: 16px;
  }
  .section.collapsed .section-grid { display: none; }
</style>
</head>
<body>

<header>
  <h1>🔋 BatteryBin Dashboard</h1>
  <input id="search" type="text" placeholder="Filter by battery type..." />
  <div id="status">Loading...</div>
</header>

<div id="grid"></div>

<script>
  // ---- Configure these two values for your Supabase project ----
  const SUPABASE_URL = "https://uymwvqdhjklmipneyigc.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV5bXd2cWRoamtsbWlwbmV5aWdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMTgzMzYsImV4cCI6MjEwMzc5NDMzNn0.BqeSIiXYflnwVt5uUSG7cOB7f4Y0iZqehjccN_Winx4";
  // ----------------------------------------------------------------

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let allRows = [];
  const collapsedSections = new Set();

  function rowDate(r) {
    return new Date(r.captured_at || r.uploaded_at);
  }

  function dateKey(d) {
    // Local calendar day, used to group and to sort sections.
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }

  function dateLabel(d) {
    const today = new Date();
    const yesterday = new Date();
    yesterday.setDate(today.getDate() - 1);
    if (dateKey(d) === dateKey(today)) return "Today";
    if (dateKey(d) === dateKey(yesterday)) return "Yesterday";
    return d.toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  }

  function cardHtml(r) {
    return `
      <div class="card ${r.is_battery ? "" : "not-battery"}">
        <img src="${r.photo_url}" alt="${r.photo_filename}" loading="lazy" />
        <div class="card-body">
          <p class="type">${r.is_battery ? r.battery_type : "Not a battery"}</p>
          <p class="filename">${r.photo_filename}</p>
          ${r.reasoning ? `<p class="reasoning">${r.reasoning}</p>` : ""}
          <p class="timestamp">${rowDate(r).toLocaleString()}</p>
        </div>
      </div>
    `;
  }

  function toggleSection(key) {
    if (collapsedSections.has(key)) {
      collapsedSections.delete(key);
    } else {
      collapsedSections.add(key);
    }
    const el = document.querySelector(`.section[data-key="${key}"]`);
    if (el) el.classList.toggle("collapsed");
  }
  window.toggleSection = toggleSection;

  function render(rows) {
    const grid = document.getElementById("grid");
    if (rows.length === 0) {
      grid.innerHTML = `<div class="empty">No readings yet.</div>`;
      return;
    }

    // Sort newest first.
    const sorted = [...rows].sort((a, b) => rowDate(b) - rowDate(a));

    // Group into date sections, preserving newest-first order.
    const groups = [];
    const groupsByKey = {};
    for (const r of sorted) {
      const key = dateKey(rowDate(r));
      if (!groupsByKey[key]) {
        groupsByKey[key] = { key, label: dateLabel(rowDate(r)), rows: [] };
        groups.push(groupsByKey[key]);
      }
      groupsByKey[key].rows.push(r);
    }

    grid.innerHTML = groups.map(g => `
      <div class="section ${collapsedSections.has(g.key) ? "collapsed" : ""}" data-key="${g.key}">
        <div class="section-header" onclick="toggleSection('${g.key}')">
          <div class="section-title">
            <span class="chevron">▾</span>
            ${g.label}
            <span class="section-count">(${g.rows.length})</span>
          </div>
        </div>
        <div class="section-grid">
          ${g.rows.map(cardHtml).join("")}
        </div>
      </div>
    `).join("");
  }

  async function loadData() {
    const status = document.getElementById("status");
    status.textContent = "Loading...";
    const { data, error } = await supabaseClient
      .from("battery_readings")
      .select("*")
      .order("captured_at", { ascending: false });

    if (error) {
      status.textContent = "Error loading data";
      console.error(error);
      return;
    }

    allRows = data;
    render(allRows);
    status.textContent = `${data.length} reading${data.length === 1 ? "" : "s"} · updated ${new Date().toLocaleTimeString()}`;
  }

  document.getElementById("search").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    const filtered = q
      ? allRows.filter(r => (r.battery_type || "").toLowerCase().includes(q))
      : allRows;
    render(filtered);
  });

  loadData();
  // Refresh automatically every 60 seconds so new syncs show up without a manual reload.
  setInterval(loadData, 60000);
</script>

</body>
</html>
